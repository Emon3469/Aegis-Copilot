services:
  - type: web
    name: aegis-copilot-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" --timeout-keep-alive 75
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-20b
      - key: LLM_PROVIDERS
        value: openai,anthropic,groq
      - key: EMBEDDING_PROVIDERS
        value: pinecone
      - key: RERANK_MODEL
        value: bge-reranker-v2-m3
      - key: PINECONE_INDEX_NAME
        value: aegis-copilot
      - key: PINECONE_NAMESPACE
        value: incident-runbooks
      - key: TAVILY_SEARCH_DEPTH
        value: basic
      - key: AUTO_INGEST
        value: "true"
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
